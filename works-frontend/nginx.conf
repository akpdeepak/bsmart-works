# nginx for the bSmart Works SPA. Serves the static bundle and reverse-proxies
# the API + actuator to the backend container on the shared compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Spring Boot backend (same-origin; no CORS preflight)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health/info passthrough (handy for edge health checks)
    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # SPA client-side routing — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
