name: Load Tests (P95 Budgets — RB-40 §5)

# Never runs on push/PR — only on explicit dispatch.
# Usage: Actions → "Load Tests (P95 Budgets)" → Run workflow
# Required input: base_url. The workspace JWT is stored as the LOAD_TEST_AUTH_TOKEN environment
# secret so it never appears in workflow-dispatch history.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (e.g. https://works-staging.bcits.in)'
        required: true
      workspace_id:
        description: 'Load-test workspace ID'
        required: false
        default: 'WS-LOADTEST'
      project_id:
        description: 'Load-test project ID'
        required: false
        default: 'PROJ-LOADTEST'
      scenario:
        description: 'Which scenario to run'
        required: true
        type: choice
        options:
          - page-load
          - work-item-create
          - search
          - dashboard
          - board-drag-drop
          - ai-cached
          - ai-uncached
          - file-upload
          - scale-10x
          - all-except-10x

permissions:
  contents: read

jobs:
  load-test:
    name: 'k6 load test — ${{ inputs.scenario }}'
    runs-on: ubuntu-latest
    environment: load-test
    env:
      AUTH_TOKEN: ${{ secrets.LOAD_TEST_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install k6
        run: |
          curl -sSfLO https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          echo 'c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  k6-v0.54.0-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf k6-v0.54.0-linux-amd64.tar.gz --strip-components=1 k6-v0.54.0-linux-amd64/k6
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: 'Run: page-load'
        if: inputs.scenario == 'page-load' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/page-load.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            -e PROJECT_ID="${{ inputs.project_id }}" \
            --out json=results-page-load.json

      - name: 'Run: work-item-create'
        if: inputs.scenario == 'work-item-create' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/work-item-create.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            -e PROJECT_ID="${{ inputs.project_id }}" \
            --out json=results-work-item-create.json

      - name: 'Run: search'
        if: inputs.scenario == 'search' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/search.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            --out json=results-search.json

      - name: 'Run: dashboard'
        if: inputs.scenario == 'dashboard' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/dashboard.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            --out json=results-dashboard.json

      - name: 'Run: board-drag-drop'
        if: inputs.scenario == 'board-drag-drop' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/board-drag-drop.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            --out json=results-board-drag-drop.json

      - name: 'Run: ai-cached'
        if: inputs.scenario == 'ai-cached' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/ai-cached.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            --out json=results-ai-cached.json

      - name: 'Run: ai-uncached'
        if: inputs.scenario == 'ai-uncached' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/ai-uncached.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            --out json=results-ai-uncached.json

      - name: 'Run: file-upload'
        if: inputs.scenario == 'file-upload' || inputs.scenario == 'all-except-10x'
        run: |
          k6 run tests/load/file-upload.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            -e PROJECT_ID="${{ inputs.project_id }}" \
            --out json=results-file-upload.json

      - name: 'Run: scale-10x (ALL scenarios at 10× concurrency)'
        if: inputs.scenario == 'scale-10x'
        run: |
          k6 run tests/load/scale-10x.js \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e AUTH_TOKEN="$AUTH_TOKEN" \
            -e WORKSPACE_ID="${{ inputs.workspace_id }}" \
            -e PROJECT_ID="${{ inputs.project_id }}" \
            --out json=results-scale-10x.json

      - name: Upload k6 JSON results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k6-results-${{ inputs.scenario }}-${{ github.run_id }}
          path: results-*.json
          retention-days: 30
