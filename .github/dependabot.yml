# Dependabot — automated dependency update PRs.
# See CLAUDE.md §12.2 for the merge policy:
#   PATCH → merge if CI passes; MINOR → check release notes; MAJOR → manual review.
version: 2
updates:
  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /works-frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # Major version bumps require manual review — Dependabot will still open the PR
      # but the policy is to review before merging (CLAUDE.md §12.2)
      []

  # Backend Maven dependencies
  - package-ecosystem: maven
    directory: /works-backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore
      include: scope
