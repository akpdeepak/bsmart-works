name: CI

# The cross-tool / cross-user enforcement gate. No matter which AI tool or person
# wrote the code, a PR cannot merge unless these checks pass.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits on the branch
      # Install gitleaks directly — avoids the gitleaks-action@v2 licence requirement
      # for private repos. Config: .gitleaks.toml (add allowlist rules there, not here).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . \
              --log-opts "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              --config .gitleaks.toml --verbose
          else
            gitleaks detect --source . \
              --log-opts "HEAD~1...HEAD" \
              --config .gitleaks.toml --verbose
          fi

  guardrails:
    name: Architecture & brand guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guardrails
        run: bash scripts/guardrails.sh

  ai-rules-in-sync:
    name: AI rules in sync with CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check derived AI-rules files are up to date
        run: node scripts/generate-ai-rules.mjs --check

  dod-in-sync:
    name: DoD version tag in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CLAUDE.md §7 and PR template carry the same dod-version
        run: bash scripts/check-dod-sync.sh

  commit-lint:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Lint all commits on this PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  frontend-test:
    name: Frontend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm test   # Vitest — unit + component tests; fails on any failure

  frontend-security:
    name: Frontend (security audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      # Fail on HIGH or CRITICAL vulnerabilities. Moderate and below are reported but non-blocking.
      # To investigate: npm audit  |  To fix automatically: npm audit fix
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      # Lint is now enforced. App.jsx legacy debt is suppressed with a file-level eslint-disable
      # comment; all new files must pass clean. Architecture/token rules also run in `guardrails`.
      - run: npm run lint
      - run: npm run build   # blocking — the app must compile

  backend:
    name: Backend (compile + checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile + run Checkstyle only. Tests and JaCoCo are skipped here — the coverage gate
      # runs in the backend-unit-test job which executes the full verify phase with unit tests.
      - name: Compile + checkstyle
        run: ./mvnw -B -DskipTests -Djacoco.skip=true verify

  backend-unit-test:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Run only @Tag("unit") tests — no live database required.
      # Runs the full verify phase so JaCoCo coverage check is enforced (≥60% LINE, haltOnFailure=true).
      # Report is written to target/site/jacoco/index.html for local inspection.
      - name: Unit tests + coverage gate
        run: ./mvnw -B -Dgroups=unit verify
