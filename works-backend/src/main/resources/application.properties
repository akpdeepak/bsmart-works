# 1. Database Connection Keys
spring.datasource.url=jdbc:postgresql://localhost:5432/works_db
spring.datasource.username=bcits_admin
spring.datasource.password=works_secure_pass

# 2. Database Rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Enable Flyway (Our Database Builder)
spring.flyway.enabled=true
spring.flyway.placeholder-replacement=false
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# 4. File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 5. JWT Secret
app.jwt.secret=bSmartWorksSecretKey2026BCITSProductionKey!!

# 5. Mail — MailHog (Docker container on :1025, web UI on :8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# 6. Attachments
# Max upload size (bytes). Default: 20 MB.
app.attachments.max-size-bytes=20971520
# ClamAV virus scanning — enabled, pointing to Docker container
app.attachments.virus-scan-enabled=true
app.attachments.clamav-host=localhost
app.attachments.clamav-port=3310