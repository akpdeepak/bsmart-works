<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2F5C" />
    <title>Offline · bSmart Works</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: Inter, system-ui, sans-serif; background: #F8FAFC; color: #0F172A;
      }
      .card { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: #0B2F5C; }
      p { font-size: .875rem; line-height: 1.5; color: #475569; margin: 0 0 1rem; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #0B2F5C; border: 0;
        border-radius: .5rem; padding: .5rem 1rem; cursor: pointer;
      }
      button:hover { background: #1E4D8C; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>
        bSmart Works can’t reach the network right now. Any changes you’ve made are saved on this
        device and will sync automatically when you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
