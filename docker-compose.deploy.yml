# ── bSmart Works — full-stack local deployment ───────────────────────────────
# Brings the whole product up in containers: Postgres + MailHog + backend
# (Spring Boot) + frontend (nginx serving the SPA and proxying the API).
#
#   Build & start:   docker compose --env-file deploy/env/local.example -f docker-compose.deploy.yml up -d --build
#   Open the app:    http://localhost:8088
#   Backend health:  http://localhost:8090/actuator/health   (also via /actuator/ on :8088)
#   Tear down:       docker compose -f docker-compose.deploy.yml down
#   Wipe the DB too: docker compose -f docker-compose.deploy.yml down -v
#
# Host ports are overridable so this never fights another local stack, e.g.:
#   BACKEND_PORT=8201 FRONTEND_PORT=8088 docker compose --env-file deploy/env/local.example -f docker-compose.deploy.yml up -d --build
#
# This is the "local Docker Compose" deploy target referenced in CLAUDE.md §13.
# The cloud target (AWS/ECS + RDS + Terraform, RB-40 §5) is a separate, gated step.
name: bsmart-deploy

services:
  # ── PostgreSQL 16 (internal only) ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-works_db}
      POSTGRES_USER: ${POSTGRES_USER:-bcits_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-works_secure_pass}
    volumes:
      - bsmart_deploy_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MailHog (dev SMTP, internal only) ───────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_PORT:-8025}:8025"

  # ── Backend (Spring Boot fat JAR) ───────────────────────────────────────────
  backend:
    build:
      context: ./works-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      BSMART_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-works_db}
      BSMART_DB_USERNAME: ${POSTGRES_USER:-bcits_admin}
      BSMART_DB_PASSWORD: ${POSTGRES_PASSWORD:-works_secure_pass}
      BSMART_JWT_SECRET: ${BSMART_JWT_SECRET:-local-compose-secret-change-before-prod-32-bytes}
      BSMART_EXPOSE_DEV_VERIFICATION_TOKEN: ${BSMART_EXPOSE_DEV_VERIFICATION_TOKEN:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SPRING_MAIL_HOST: mailhog          # relaxed-binding override of spring.mail.host
      SPRING_MAIL_PORT: "1025"
      APP_ATTACHMENTS_VIRUS_SCAN_ENABLED: "false"   # ClamAV WSL2 dependency not in this stack
      APP_ATTACHMENTS_DIR: /data/uploads            # backed by bsmart_uploads named volume — survives container restarts
      BSMART_CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}"
      BSMART_FRONTEND_BASE_URL: "http://localhost:${FRONTEND_PORT:-8088}"
    volumes:
      - bsmart_uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 20

  # ── Frontend (nginx: SPA + API reverse-proxy) ───────────────────────────────
  frontend:
    build:
      context: ./works-frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  bsmart_deploy_pg_data:
  bsmart_uploads:       # durable attachment storage — never lost on backend container restart
