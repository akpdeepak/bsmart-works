# 1. Database Connection Keys
spring.datasource.url=jdbc:postgresql://localhost:5432/works_db
spring.datasource.username=bcits_admin
spring.datasource.password=works_secure_pass

# 2. Database Rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Enable Flyway (Our Database Builder)
spring.flyway.enabled=true