<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F5C"/>
      <stop offset="100%" stop-color="#1E4D8C"/>
    </linearGradient>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E94E1B"/>
      <stop offset="100%" stop-color="#F39200"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so it works under any mask -->
  <rect width="160" height="160" fill="url(#g)"/>
  <!-- Works bars and chevron centered inside the "safe area" (inner 80% = 128x128 centered) -->
  <!-- Safe area: x=16, y=16, w=128, h=128. We scale content to fit. -->
  <g transform="translate(16, 16) scale(0.8)">
    <rect x="34" y="92" width="20" height="38" rx="4" fill="#FFFFFF" opacity="0.94"/>
    <rect x="62" y="72" width="20" height="58" rx="4" fill="#FFFFFF" opacity="0.94"/>
    <rect x="90" y="50" width="20" height="80" rx="4" fill="#FFFFFF" opacity="0.94"/>
    <path d="M 100 28 L 128 48 L 100 68 Z" fill="url(#p)"/>
  </g>
</svg>
