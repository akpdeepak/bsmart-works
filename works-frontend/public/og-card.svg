<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F5C"/>
      <stop offset="100%" stop-color="#1E4D8C"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E94E1B"/>
      <stop offset="100%" stop-color="#F39200"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(233,78,27,0.18)"/>
      <stop offset="100%" stop-color="rgba(233,78,27,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#orangeGlow)"/>

  <!-- Logo glyph -->
  <g transform="translate(80, 80)">
    <rect width="120" height="120" rx="24" ry="24" fill="rgba(255,255,255,0.10)"/>
    <g transform="translate(0, 0) scale(0.75)">
      <rect x="34" y="92" width="20" height="38" rx="4" fill="#FFFFFF" opacity="0.94"/>
      <rect x="62" y="72" width="20" height="58" rx="4" fill="#FFFFFF" opacity="0.94"/>
      <rect x="90" y="50" width="20" height="80" rx="4" fill="#FFFFFF" opacity="0.94"/>
      <path d="M 100 28 L 128 48 L 100 68 Z" fill="url(#orange)"/>
    </g>
  </g>

  <!-- Wordmark beside logo -->
  <g transform="translate(220, 110)">
    <text x="0" y="0" font-family="Inter, -apple-system, Arial, sans-serif"
          font-size="34" font-weight="300" fill="rgba(255,255,255,0.75)">bSmart</text>
    <text x="0" y="56" font-family="Inter, -apple-system, Arial, sans-serif"
          font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="-1.2">Works</text>
  </g>

  <!-- Main headline -->
  <text x="80" y="350" font-family="Inter, -apple-system, Arial, sans-serif"
        font-size="84" font-weight="700" fill="#FFFFFF" letter-spacing="-2.4">Work, in rhythm.</text>

  <!-- Subhead -->
  <text x="80" y="420" font-family="Inter, -apple-system, Arial, sans-serif"
        font-size="28" font-weight="400" fill="rgba(255,255,255,0.78)">A project workspace built for utilities and engineering teams.</text>

  <!-- Bottom row: feature pills -->
  <g transform="translate(80, 500)" font-family="Inter, -apple-system, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)">
    <g>
      <rect x="0" y="0" width="220" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="110" y="29" text-anchor="middle">Compliance built in</text>
    </g>
    <g transform="translate(238, 0)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="85" y="29" text-anchor="middle">SLAs from day one</text>
    </g>
    <g transform="translate(426, 0)">
      <rect x="0" y="0" width="180" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="90" y="29" text-anchor="middle">No-code config</text>
    </g>
  </g>

  <!-- BCITS footer -->
  <text x="80" y="600" font-family="Inter, -apple-system, Arial, sans-serif"
        font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="2">A BCITS PRODUCT</text>
</svg>
