name: Deploy

# Manual-trigger deploy workflow (RB-05 / RB-40 gated).
# Required environment secrets:
#   DEPLOY_SSH_HOST      target host
#   DEPLOY_SSH_USER      SSH user with write access to deploy dirs
#   DEPLOY_SSH_KEY       private key for the SSH user
# Required environment vars:
#   DEPLOY_BACKEND_DIR       directory that receives app.jar, e.g. /opt/bsmart/backend
#   DEPLOY_FRONTEND_DIR      directory served by nginx/CDN origin, e.g. /var/www/bsmart
#   DEPLOY_BACKEND_SERVICE   systemd unit to restart, e.g. bsmart-backend
# Optional environment vars:
#   DEPLOY_FRONTEND_RELOAD   command run after frontend sync, e.g. sudo systemctl reload nginx
#   BACKEND_HEALTH_URL       endpoint checked after backend deploy
#   FRONTEND_HEALTH_URL      endpoint checked after frontend deploy
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      component:
        description: Component to deploy
        required: true
        type: choice
        default: full-stack
        options: [full-stack, backend, frontend]
      confirm_production:
        description: "Type DEPLOY to confirm production deploy (ignored for staging)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pre-flight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Block unconfirmed production deploy
        if: inputs.environment == 'production' && inputs.confirm_production != 'DEPLOY'
        run: |
          echo "Production deploy requires confirm_production = 'DEPLOY'" >&2
          exit 1

      - name: Validate immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be an immutable semantic version tag such as v1.2.3"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent

      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_BACKEND_DIR: ${{ vars.DEPLOY_BACKEND_DIR }}
          DEPLOY_FRONTEND_DIR: ${{ vars.DEPLOY_FRONTEND_DIR }}
          DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          missing=0
          require() {
            if [ -z "${!1}" ]; then
              echo "::error::$1 is required for the ${{ inputs.environment }} environment"
              missing=1
            fi
          }
          require DEPLOY_SSH_HOST
          require DEPLOY_SSH_USER
          require DEPLOY_SSH_KEY
          if [ "${{ inputs.component }}" != "frontend" ]; then
            require DEPLOY_BACKEND_DIR
            require DEPLOY_BACKEND_SERVICE
            require BACKEND_HEALTH_URL
          fi
          if [ "${{ inputs.component }}" != "backend" ]; then
            require DEPLOY_FRONTEND_DIR
            require FRONTEND_HEALTH_URL
          fi
          exit "$missing"

  build-backend:
    name: Build backend JAR
    needs: pre-flight
    if: inputs.component == 'full-stack' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package backend
        run: |
          ./mvnw -B -Dgroups=unit verify
          jar_path="$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          cp "$jar_path" target/app.jar
          (cd target && sha256sum app.jar > app.jar.sha256)
      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-jar
          path: |
            works-backend/target/app.jar
            works-backend/target/app.jar.sha256
          retention-days: 7

  build-frontend:
    name: Build frontend static files
    needs: pre-flight
    if: inputs.component == 'full-stack' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: |
          npm run build
          tar -czf frontend-dist.tar.gz -C dist .
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: |
            works-frontend/frontend-dist.tar.gz
            works-frontend/frontend-dist.tar.gz.sha256
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: [pre-flight, build-backend, build-frontend]
    if: always() && needs.pre-flight.result == 'success' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_BACKEND_DIR: ${{ vars.DEPLOY_BACKEND_DIR }}
      DEPLOY_FRONTEND_DIR: ${{ vars.DEPLOY_FRONTEND_DIR }}
      DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
      DEPLOY_FRONTEND_RELOAD: ${{ vars.DEPLOY_FRONTEND_RELOAD }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
    steps:
      - name: Download backend artifact
        if: inputs.component == 'full-stack' || inputs.component == 'backend'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-jar
          path: deploy/backend

      - name: Download frontend artifact
        if: inputs.component == 'full-stack' || inputs.component == 'frontend'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: deploy/frontend

      - name: Verify downloaded artifacts
        run: |
          if [ "${{ inputs.component }}" != "frontend" ]; then
            (cd deploy/backend && sha256sum -c app.jar.sha256)
          fi
          if [ "${{ inputs.component }}" != "backend" ]; then
            (cd deploy/frontend && sha256sum -c frontend-dist.tar.gz.sha256)
            mkdir -p deploy/frontend/dist
            tar -xzf deploy/frontend/frontend-dist.tar.gz -C deploy/frontend/dist
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        if: inputs.component == 'full-stack' || inputs.component == 'backend'
        run: |
          jar_path="deploy/backend/app.jar"
          if [ -z "$jar_path" ]; then
            echo "::error::Backend JAR artifact not found"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "mkdir -p '$DEPLOY_BACKEND_DIR' && if [ -f '$DEPLOY_BACKEND_DIR/app.jar' ]; then cp '$DEPLOY_BACKEND_DIR/app.jar' '$DEPLOY_BACKEND_DIR/app.jar.rollback'; fi"
          scp -i ~/.ssh/deploy_key "$jar_path" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_BACKEND_DIR/app.jar.next"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "mv '$DEPLOY_BACKEND_DIR/app.jar.next' '$DEPLOY_BACKEND_DIR/app.jar' && sudo systemctl restart '$DEPLOY_BACKEND_SERVICE'"

      - name: Deploy frontend
        if: inputs.component == 'full-stack' || inputs.component == 'frontend'
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "mkdir -p '$DEPLOY_FRONTEND_DIR' && tar -czf /tmp/bsmart-frontend.rollback.tgz -C '$DEPLOY_FRONTEND_DIR' ."
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" deploy/frontend/dist/ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_FRONTEND_DIR/"
          if [ -n "$DEPLOY_FRONTEND_RELOAD" ]; then
            ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "$DEPLOY_FRONTEND_RELOAD"
          fi

      - name: Backend health check
        if: inputs.component == 'full-stack' || inputs.component == 'backend'
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "$BACKEND_HEALTH_URL" >/tmp/backend-health.json; then
              cat /tmp/backend-health.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend health check failed: $BACKEND_HEALTH_URL"
          exit 1

      - name: Frontend health check
        if: inputs.component == 'full-stack' || inputs.component == 'frontend'
        run: |
          curl -fsSI "$FRONTEND_HEALTH_URL" >/tmp/frontend-health.txt
          cat /tmp/frontend-health.txt

      - name: Roll back failed deployment
        if: failure()
        run: |
          if [ "${{ inputs.component }}" != "frontend" ]; then
            ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "if [ -f '$DEPLOY_BACKEND_DIR/app.jar.rollback' ]; then mv '$DEPLOY_BACKEND_DIR/app.jar.rollback' '$DEPLOY_BACKEND_DIR/app.jar' && sudo systemctl restart '$DEPLOY_BACKEND_SERVICE'; fi"
          fi
          if [ "${{ inputs.component }}" != "backend" ]; then
            ssh -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "if [ -f /tmp/bsmart-frontend.rollback.tgz ]; then find '$DEPLOY_FRONTEND_DIR' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && tar -xzf /tmp/bsmart-frontend.rollback.tgz -C '$DEPLOY_FRONTEND_DIR'; fi"
          fi
