name: E2E (Sprint Cockpit)

# Browser-driven end-to-end suite. Not on the PR merge gate — it needs the full stack
# (Postgres + backend + frontend + a real browser), so it runs on demand from the Actions
# tab. Mirrors the ci.yml "smoke boot" job for the backend, then drives the cockpit UI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (cockpit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcits_admin
          POSTGRES_PASSWORD: works_secure_pass
          POSTGRES_DB: works_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bcits_admin -d works_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Build backend jar
        working-directory: works-backend
        run: ./mvnw -B -DskipTests -Djacoco.skip=true package

      - name: Boot backend (Flyway + ddl-auto=validate)
        working-directory: works-backend
        env:
          BSMART_DB_URL: jdbc:postgresql://127.0.0.1:5432/works_db
          BSMART_DB_USERNAME: bcits_admin
          BSMART_DB_PASSWORD: works_secure_pass
        run: |
          JAR="$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -1)"
          java -jar "$JAR" --server.port=8080 --app.attachments.virus-scan-enabled=false > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Started .* in .* seconds" /tmp/backend.log; then echo "backend up"; break; fi
            if grep -qE "APPLICATION FAILED TO START|FlywayException|Error creating bean" /tmp/backend.log; then
              tail -120 /tmp/backend.log; exit 1; fi
            sleep 2
          done

      - name: Provision a loginable workspace member
        run: |
          curl -s -X POST http://127.0.0.1:8080/api/v1/auth/signup -H 'Content-Type: application/json' \
            -d '{"email":"e2e-seed@e2e.test","password":"E2ePass123!","fullName":"E2E Seed"}' > /dev/null
          PGPASSWORD=works_secure_pass psql -h 127.0.0.1 -U bcits_admin -d works_db -c \
            "UPDATE users SET password_hash=(SELECT password_hash FROM users WHERE email='e2e-seed@e2e.test'), \
             email_verified=true WHERE email='deepak@bcits.com';"

      - name: Install frontend deps
        working-directory: works-frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: works-frontend
        run: npx playwright install --with-deps chromium

      - name: Build + serve frontend
        working-directory: works-frontend
        run: |
          npm run build
          npx vite preview --port 5173 --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          npx wait-on http://127.0.0.1:5173 -t 60000

      - name: Run Playwright E2E
        working-directory: works-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:8080/api/v1
          E2E_EMAIL: deepak@bcits.com
          E2E_PASSWORD: E2ePass123!
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: works-frontend/playwright-report/
          retention-days: 7
