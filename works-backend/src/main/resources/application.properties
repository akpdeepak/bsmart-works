# 1. Database Connection Keys
spring.datasource.url=${BSMART_DB_URL:jdbc:postgresql://localhost:5432/works_db}
spring.datasource.username=${BSMART_DB_USERNAME:bcits_admin}
spring.datasource.password=${BSMART_DB_PASSWORD:works_secure_pass}

# 2. Database Rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP connection pool (CLAUDE.md §18)
# Sized for a typical team-sized workload. Increase maximum-pool-size when query latency rises
# or connection wait times appear in /actuator/health details.
spring.datasource.hikari.pool-name=BSmartHikariPool
spring.datasource.hikari.maximum-pool-size=${BSMART_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${BSMART_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# 3. Enable Flyway (Our Database Builder)
spring.flyway.enabled=true
spring.flyway.placeholder-replacement=false
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# 4. File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Attachment storage directory — overridable via APP_ATTACHMENTS_DIR env var.
# Default keeps dev parity with the previous hardcoded path.
# In containerised deployments, mount a named volume and set APP_ATTACHMENTS_DIR to that path
# (see docker-compose.deploy.yml). Target storage is S3/MinIO per WRK-ARCH-08 (see TD-026).
app.attachments.dir=${APP_ATTACHMENTS_DIR:${user.home}/.bsmart-works/uploads}

# 5. Security
app.jwt.secret=${BSMART_JWT_SECRET:dev-only-change-me-bSmartWorksSecretKey2026}
app.cors.allowed-origins=${BSMART_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.expose-dev-verification-token=${BSMART_EXPOSE_DEV_VERIFICATION_TOKEN:false}
# Frontend origin used to build verification / password-reset links in emails.
app.frontend.base-url=${BSMART_FRONTEND_BASE_URL:http://localhost:5173}
# CSP frame-ancestors for the public, read-only dashboard-embed API (/api/v1/public/**) only —
# governs who may iframe an embedded dashboard (iteration 6, Cap J). The authenticated app stays
# 'none' (never framable). Defaults to 'self' (same-origin embeds); set this to a space-separated
# allow-list of a workspace's customer-portal origins to embed cross-origin. NEVER set it to '*'.
app.embed.frame-ancestors=${BSMART_EMBED_FRAME_ANCESTORS:'self'}

# 5. Mail — MailHog (Docker container on :1025, web UI on :8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# 6. Actuator — health and info endpoints (CLAUDE.md §14)
# Only health and info are exposed over HTTP; all other endpoints are disabled.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=bSmart Works
info.app.description=AI-native project management and delivery workspace

# 7. OpenAPI / Swagger UI (TD-006)
# Docs are generated at runtime from the Spring controllers.
# JSON spec: /api-docs  ·  Browser UI: /swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# 8. Attachments
# Max upload size (bytes). Default: 20 MB.
app.attachments.max-size-bytes=20971520
# ClamAV via Ubuntu WSL2 (172.25.215.11). Update IP if WSL2 restarts.
# To auto-resolve: run `wsl -d Ubuntu -- hostname -I` to get current IP.
app.attachments.virus-scan-enabled=true
app.attachments.clamav-host=172.25.215.11
app.attachments.clamav-port=3310


# 9. AI provider (TD-016)
# Set ANTHROPIC_API_KEY to activate the live Anthropic provider.
# Without it, the deterministic offline provider is used automatically.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# 10. OAuth integration credentials (TD-017, B23)
# Set provider credentials to activate live OAuth flows. Without them connectors display
# "Not configured" state — no broken UI.
oauth.slack.client-id=${SLACK_CLIENT_ID:}
oauth.slack.client-secret=${SLACK_CLIENT_SECRET:}
oauth.github.client-id=${GITHUB_CLIENT_ID:}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
oauth.gitlab.client-id=${GITLAB_CLIENT_ID:}
oauth.gitlab.client-secret=${GITLAB_CLIENT_SECRET:}

# 11. Encryption (TD-017, B31)
# 32-byte Base64-encoded AES-256 key. Without it an ephemeral dev key is used (data lost on restart).
encryption.master-key=${ENCRYPTION_KEY:}

# 12. PII vault (RB-40 §3, EPIC-P1-pii-vault)
# enabled: dual-write personal data into the per-subject crypto-shred vault on writes + backfill.
# read-from-vault: resolve display PII from the vault instead of the legacy plaintext column. Kept
#   false during the dual-write window so the legacy column stays authoritative (safe, zero-loss
#   rollback — just flip back). Flip per-environment once the vault is proven in production; the
#   irreversible CONTRACT migration that drops the plaintext columns is deferred (EPIC §3/§12).
pii.vault.enabled=${PII_VAULT_ENABLED:true}
pii.vault.read-from-vault=${PII_VAULT_READ_FROM_VAULT:false}
# login-via-blind-index: resolve users by email_hmac (blind index) instead of the raw email column.
# Default OFF so merging the tokenization work never changes login behaviour — flip per-environment
# only AFTER the backfill has populated email_hmac for every existing user, else login would miss them.
pii.vault.login-via-blind-index=${PII_VAULT_LOGIN_VIA_BLIND_INDEX:false}
# backfill-on-start: run the one-shot, idempotent backfill of existing users into the vault at boot.
# Default off; the operator flips it on for a single rollout boot, then off again.
pii.vault.backfill-on-start=${PII_VAULT_BACKFILL_ON_START:false}

# 13. Blind index (RB-40 §3, EPIC-P1-pii-vault) — keyed HMAC for searchable tokenized fields (email).
# Separate from the encryption master key. Without it an insecure dev default is used (set in prod).
blind-index.key=${BLIND_INDEX_KEY:}

# 14. KMS / BYOK for the PII vault (RB-40 §3/§4, EPIC-P1-pii-vault Slice 5). The AWS provider activates
# only when cloud.aws.credentials.access-key is set; otherwise LocalKmsProvider (master-key-derived) is
# the default. Full prod/non-prod recipe: docs/compliance/PII-VAULT-KMS-CONFIG.md.
pii.vault.kms.region=${PII_VAULT_KMS_REGION:ap-south-1}
pii.vault.kms.default-key-id=${PII_VAULT_KMS_DEFAULT_KEY_ID:}
# Non-prod only (e.g. LocalStack) — leave blank in prod so the real AWS KMS endpoint + credential chain are used.
pii.vault.kms.endpoint-override=${PII_VAULT_KMS_ENDPOINT_OVERRIDE:}
pii.vault.kms.access-key=${PII_VAULT_KMS_ACCESS_KEY:test}
pii.vault.kms.secret-key=${PII_VAULT_KMS_SECRET_KEY:test}
