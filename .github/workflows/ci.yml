name: CI

# The cross-tool / cross-user enforcement gate. No matter which AI tool or person
# wrote the code, a PR cannot merge unless these checks pass.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR. When several commits (or several agents)
# push in quick succession, only the newest commit runs the full 14-job suite; older in-flight
# runs are cancelled instead of stacking. This is the highest-leverage reduction in private-repo
# Actions-minute consumption and is what keeps the repo inside the free monthly allotment.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits on the branch
      # Install gitleaks directly — avoids the gitleaks-action@v2 licence requirement
      # for private repos. Config: .gitleaks.toml (add allowlist rules there, not here).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . \
              --log-opts "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" \
              --config .gitleaks.toml --verbose
          else
            gitleaks detect --source . \
              --log-opts "HEAD~1...HEAD" \
              --config .gitleaks.toml --verbose
          fi

  guardrails:
    name: Architecture & brand guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guardrails
        run: bash scripts/guardrails.sh

  ai-rules-in-sync:
    name: AI rules in sync with CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check derived AI-rules files are up to date
        run: node scripts/generate-ai-rules.mjs --check

  dod-in-sync:
    name: DoD version tag in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CLAUDE.md §7 and PR template carry the same dod-version
        run: bash scripts/check-dod-sync.sh

  commit-lint:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Lint all commits on this PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  frontend-test:
    name: Frontend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm test   # Vitest — unit + component tests; fails on any failure

  frontend-security:
    name: Frontend (security audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      # Fail on HIGH or CRITICAL vulnerabilities. Moderate and below are reported but non-blocking.
      # To investigate: npm audit  |  To fix automatically: npm audit fix
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      # Lint is now enforced. App.jsx legacy debt is suppressed with a file-level eslint-disable
      # comment; all new files must pass clean. Architecture/token rules also run in `guardrails`.
      - run: npm run lint
      - run: npm run build   # blocking — the app must compile

  frontend-storybook:
    name: Frontend (Storybook build — TD-014)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      # Build Storybook (no dev server) — catches broken story imports and component regressions.
      # Build artefact is written to storybook-static/ (not committed).
      - run: npm run storybook:build

  # API docs generated at /swagger-ui.html
  backend:
    name: Backend (compile + checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile + run Checkstyle only. Tests and JaCoCo are skipped here — the coverage gate
      # runs in the backend-unit-test job which executes the full verify phase with unit tests.
      - name: Compile + checkstyle
        run: ./mvnw -B -DskipTests -Djacoco.skip=true verify

  backend-unit-test:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Run only @Tag("unit") tests — no live database required.
      # Runs the full verify phase so JaCoCo coverage check is enforced (≥60% LINE, haltOnFailure=true).
      # Report is written to target/site/jacoco/index.html for local inspection.
      - name: Unit tests + coverage gate
        run: ./mvnw -B -Dgroups=unit verify

  backend-integration-test:
    name: Backend (integration — Flyway + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Boots the app against a real Postgres via Testcontainers (Docker is available on
      # ubuntu-latest) and applies EVERY Flyway migration end-to-end. This is the stage that would
      # have caught the V35 duplicate-version collision and bad migration SQL before merge.
      # Invoke failsafe directly (not the surefire `test` phase) so DB-less @SpringBootTest classes
      # like DemoApplicationTests are not run here, and skip JaCoCo (its gate is the unit job).
      - name: Integration tests (Testcontainers + Flyway)
        run: ./mvnw -B -Djacoco.skip=true test-compile failsafe:integration-test failsafe:verify

  backend-smoke-boot:
    name: Backend (smoke boot — real app + ddl-auto=validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    # Starts the ACTUAL packaged application against a real Postgres with the production config
    # (Flyway migrations + spring.jpa.hibernate.ddl-auto=validate) and asserts it reaches
    # "Started ... in N seconds". The Testcontainers integration jobs run a test ApplicationContext
    # and never exercise a full validated boot, so two whole classes of defect reach main green:
    #   1. entity<->schema drift  — a JPA @Column with no backing Flyway migration (validate aborts)
    #   2. bean-wiring / DI failures — a constructor dependency with no registered bean
    # This job is the gate that catches both before merge.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcits_admin
          POSTGRES_PASSWORD: works_secure_pass
          POSTGRES_DB: works_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bcits_admin -d works_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build application jar
        run: ./mvnw -B -DskipTests -Djacoco.skip=true package
      - name: Boot the app against a real DB and assert startup
        run: |
          JAR="$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -1)"
          echo "Booting $JAR (Flyway + ddl-auto=validate) against Postgres…"
          java -jar "$JAR" \
            --server.port=8080 \
            --app.attachments.virus-scan-enabled=false \
            > boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 90); do
            if grep -q "Started .* in .* seconds" boot.log; then
              echo "✅ Application booted cleanly against a real database."
              kill "$APP_PID" 2>/dev/null || true
              exit 0
            fi
            if grep -qE "APPLICATION FAILED TO START|Schema-validation:|FlywayException|UnsatisfiedDependencyException|Error creating bean" boot.log; then
              echo "❌ Boot failed — see log:"; tail -n 120 boot.log
              kill "$APP_PID" 2>/dev/null || true
              exit 1
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "❌ App process exited before startup completed:"; tail -n 120 boot.log
              exit 1
            fi
            sleep 2
          done
          echo "❌ Timed out waiting for startup:"; tail -n 120 boot.log
          kill "$APP_PID" 2>/dev/null || true
          exit 1

  integration-tests:
    name: Backend (integration — @Tag("integration") suite + workspace isolation)
    runs-on: ubuntu-latest
    needs: [backend, backend-unit-test]
    # Docker is pre-installed on ubuntu-latest; Testcontainers will pull postgres:16-alpine
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Run the @Tag("integration") test suite via surefire (no exclude filter override needed —
      # -Dgroups=integration is the selector) plus failsafe for *IntegrationTest classes.
      # JaCoCo is skipped — coverage gate is the unit job. Docker is available on ubuntu-latest;
      # Testcontainers will auto-start postgres:16-alpine for any @SpringBootTest that needs a DB.
      # This job catches: ComplianceEvaluationPerformanceTest, SlaBulkApplyIntegrationTest,
      # FlywayMigrationIntegrationTest, SecurityAuditIntegrationTest, WorkspaceTenantIsolationIT,
      # and any future @Tag("integration") tests.
      - name: Integration tests (Testcontainers + @Tag integration suite)
        run: ./mvnw -B -Djacoco.skip=true -Dsurefire.excludes="" -Dgroups=integration verify 2>&1

  jetbrains-plugin:
    name: JetBrains plugin (buildPlugin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/jetbrains-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # plugin JVM toolchain targets Java 17 (build.gradle.kts)
          cache: gradle
      # Gradle wrapper is not present in the plugin directory, so we invoke gradle via the
      # wrapper at the repo root level — there is none, so install Gradle directly via the
      # setup-gradle action.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build JetBrains plugin
        run: gradle buildPlugin --no-daemon

  perf-budget:
    name: Performance budget (bundle size)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Bundle size check (Doherty proxy — JS < 500 KB gzipped)
        run: |
          TOTAL=$(find dist/assets -name "*.js" -exec gzip -c {} \; | wc -c)
          echo "Total gzipped JS: ${TOTAL} bytes"
          # 512000 = 500 KB gzipped — Doherty threshold proxy budget
          if [ "$TOTAL" -gt 512000 ]; then
            echo "Bundle exceeds 500 KB gzipped (${TOTAL} bytes). Optimize before merging."
            exit 1
          fi
          echo "Bundle within budget (${TOTAL} / 512000 bytes)"

  chromatic:
    name: Chromatic (visual regression)
    runs-on: ubuntu-latest
    # Only run on PRs and pushes to main; skip forks without the secret (they won't have it).
    # Non-blocking: visual diffs are reviewed in the Chromatic UI — they do not block merge.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Chromatic needs full history to diff against the baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: works-frontend
          # Exit zero even if there are visual diffs so this job stays non-blocking.
          # The Chromatic UI is the review surface for visual changes.
          exitZeroOnChanges: true
