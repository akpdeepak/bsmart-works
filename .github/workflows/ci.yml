name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed paths and risk
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      frontend_security: ${{ steps.changes.outputs.frontend_security }}
      backend: ${{ steps.changes.outputs.backend }}
      integration: ${{ steps.changes.outputs.integration }}
      deploy: ${{ steps.changes.outputs.deploy }}
      jetbrains: ${{ steps.changes.outputs.jetbrains }}
      risk: ${{ steps.changes.outputs.risk }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: changes
        name: Compute impact from the repository-owned classifier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks release
        run: |
          set -euo pipefail
          version=8.21.2
          curl --retry 5 --retry-all-errors --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan the pushed/PR range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: gitleaks detect --source . --log-opts "${BASE_SHA}...${{ github.sha }}" --config .gitleaks.toml --verbose

  policy:
    name: Policy, generated state, rules, links, and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - name: Install frontend dependencies for runtime policy gates
        run: npm ci
        working-directory: works-frontend
      - name: Run the manifest-owned policy and repository quality gates
        run: node scripts/verify.mjs --profile changed --paths ai-rules/AGENT-CORE.md

  commit-lint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  frontend:
    name: Frontend lint, test, build, and Storybook
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runs from the repository root: the gate reads works-frontend/dist produced by the step above.
      - name: Frontend initial-payload budget
        run: node scripts/check-bundle-budget.mjs
        working-directory: ${{ github.workspace }}
      - run: npm run build-storybook

  frontend-security:
    name: Frontend dependency audit
    needs: classify
    if: needs.classify.outputs.frontend_security == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: works-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  backend-unit:
    name: Backend unit, coverage, and style
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Dgroups=unit verify

  backend-integration:
    name: Backend integration (single Testcontainers suite)
    needs: classify
    if: needs.classify.outputs.integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: works-backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Djacoco.skip=true -Dgroups=integration verify

  deploy-smoke:
    name: Deployment templates
    needs: classify
    if: needs.classify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate deployment Compose files
        run: |
          set -euo pipefail
          for env_file in deploy/env/local.example deploy/env/staging.example deploy/env/production.example; do
            docker compose --env-file "$env_file" -f docker-compose.deploy.yml config --quiet
          done

  jetbrains-plugin:
    name: JetBrains plugin
    needs: classify
    if: needs.classify.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/jetbrains-plugin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19
        with:
          gradle-version: '8.7'
      - run: gradle buildPlugin --no-daemon

  merge-gate:
    name: merge-gate
    if: always()
    needs:
      - classify
      - secrets-scan
      - policy
      - commit-lint
      - frontend
      - frontend-security
      - backend-unit
      - backend-integration
      - deploy-smoke
      - jetbrains-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable job to pass
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "An applicable CI job did not pass: $RESULTS" >&2
              exit 1
            fi
          done
          echo "All applicable CI jobs passed or were intentionally skipped: $RESULTS"
