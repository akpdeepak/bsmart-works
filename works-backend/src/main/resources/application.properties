# 1. Database Connection Keys
spring.datasource.url=jdbc:postgresql://localhost:5432/works_db
spring.datasource.username=bcits_admin
spring.datasource.password=works_secure_pass

# 2. Database Rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Enable Flyway (Our Database Builder)
spring.flyway.enabled=true

# 4. File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 5. JWT Secret
app.jwt.secret=bSmartWorksSecretKey2026BCITSProductionKey!!

# 5. Mail (dev stub — no actual email sent)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false