# nginx for the bSmart Works SPA. Serves the static bundle and reverse-proxies
# the API + actuator to the backend container on the shared compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Spring Boot backend (same-origin; no CORS preflight)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health/info passthrough (handy for edge health checks)
    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # Public, read-only dashboard embed page (iteration 6, Cap J — "iframe-embeddable URLs").
    # This is the SAME SPA bundle, but served with a NARROW framing allowance so it can sit in an
    # iframe on a customer status page / internal portal. The allowance is scoped to this path only
    # — every other app route below stays unframable (frame-ancestors 'none' + X-Frame-Options DENY).
    # Default is 'self' (same-origin embeds); change frame-ancestors here (or front it with an env
    # template) to an explicit allow-list of customer origins. Never use '*'. The data itself is
    # already token-scoped and free of PII/owner identity (PublicDashboardController, RB-40 §1).
    location /embed/ {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Note: X-Frame-Options is intentionally omitted here — it can only express DENY/SAMEORIGIN,
        # which would contradict the frame-ancestors allow-list above (the modern, expressive control).
        try_files $uri $uri/ /index.html;
    }

    # SPA client-side routing — fall back to index.html. The authenticated app is never framable.
    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
